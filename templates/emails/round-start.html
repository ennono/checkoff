<!-- Sent when a new round of a repeating checklist starts. -->
<h1 style="font-size:22px;margin:0 0 16px;">{{ checklist }}: {{ round_label }}</h1>
<p>A new round has started. It runs from {{ round_start }} to {{ round_end }}.</p>
<p>{{ last_round_summary }}</p>
<p><a href="{{ checklist_url }}" style="display:inline-block;padding:10px 18px;border-radius:8px;background:#2271b1;color:#ffffff;font-weight:700;text-decoration:none;">Open the checklist</a></p>
{{ items_html }}
